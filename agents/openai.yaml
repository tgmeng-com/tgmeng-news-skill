interface:
  display_name: "Tgmeng Open API Skill"
  short_description: "Search hotspots, procurement notices, Tgmeng Index and daily reports"
  default_prompt: "Use $tgmeng-news-skill to query Tgmeng hotspot/news data, structured procurement and tender notices, Tgmeng Index rankings, or generated daily reports through the Tgmeng Open Platform. Use POST /v1/hot/search for hotspots, /v1/procurement/search for procurement, /v1/candy/search for Tgmeng Index, and /v1/daily/search for daily reports. Authenticate with Authorization: Bearer tgm_open_... from account.tgmeng.com/developer. Never use a legacy license field, never log the API key, and do not call the removed image upload service."
policy:
  allow_implicit_invocation: true
