interface:
  display_name: "Tgmeng Hotspot, Procurement and Open APIs"
  short_description: "Search hotspots, procurement notices, index/daily data, and upload images/files"
  default_prompt: "Use $tgmeng-news-skill to search Tgmeng hotspot data, structured procurement/tender notices, Tgmeng Index data, generated daily reports, or upload images/files. Use /api/skill/search for news/hotspots and /api/skill/procurement/search for bidding, government procurement, public-resource trading, purchaser, agency, project number, or award-result requests. These search APIs reuse permissions and quota but have separate response contracts. Use limit null by default; TODAY/HISTORY default/max to 500 and HISTORY must remain in one calendar month. Procurement REALTIME returns each source's latest available data; read sourceStatuses[].dataScope/latestPublicationDate, never describe fallback data as today's. TODAY/HISTORY remain strict time filters. Treat procurement NO_DATA as a successful collection with no notice today, not a failure. For image upload, require a stable X-Machine-Id and never expose the full license."
policy:
  allow_implicit_invocation: true
