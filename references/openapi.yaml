openapi: 3.0.3
info:
  title: Tgmeng Open Platform Skill API
  version: 3.0.0
  description: |
    Tgmeng/糖果梦 Open Platform APIs for hotspot search, procurement notices,
    Tgmeng Index and daily reports. Uses a site-wide API key from
    https://account.tgmeng.com/developer. Image/file upload is not part of v3.
servers:
  - url: https://api-open.tgmeng.com
security:
  - bearerAuth: []
paths:
  /v1/hot/search:
    post:
      operationId: searchHotspots
      summary: Search hotspots and news
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotSearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/procurement/search:
    post:
      operationId: searchProcurement
      summary: Search procurement and tender notices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementSearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/candy/search:
    post:
      operationId: searchTgmengIndex
      summary: Search Tgmeng Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandySearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/daily/search:
    post:
      operationId: searchDailyReports
      summary: Search daily reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tgm_open_key
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Key disabled/expired or feature not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit or daily quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HotSearchRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [REALTIME, TODAY, HISTORY]
        keywords:
          type: array
          items: { type: string }
        rootCategories:
          type: array
          items: { type: string }
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 500, default: 500 }
        offset: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        distinct: { type: boolean, default: false }
      required: [mode]
    ProcurementSearchRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [REALTIME, TODAY, HISTORY]
        keywords: { type: array, items: { type: string } }
        sourceCodes: { type: array, items: { type: string } }
        sourceGroups: { type: array, items: { type: string } }
        recordFamilies: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        provinces: { type: array, items: { type: string } }
        cities: { type: array, items: { type: string } }
        rawTypes: { type: array, items: { type: string } }
        projectNumber: { type: string, nullable: true }
        purchaser: { type: string, nullable: true }
        agency: { type: string, nullable: true }
        startTime: { type: string, nullable: true }
        endTime: { type: string, nullable: true }
        publishedFrom: { type: string, nullable: true }
        publishedTo: { type: string, nullable: true }
        deadlineFrom: { type: string, nullable: true }
        deadlineTo: { type: string, nullable: true }
        amountMin: { type: number, nullable: true }
        amountMax: { type: number, nullable: true }
        sort:
          type: string
          enum: [PUBLISHED_AT_DESC, PUBLISHED_AT_ASC, DEADLINE_ASC, DEADLINE_DESC, AMOUNT_DESC, AMOUNT_ASC]
        limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
        offset: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        distinct: { type: boolean, default: false }
      required: [mode]
    CandySearchRequest:
      type: object
      properties:
        keywords: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        limit: { type: integer, minimum: 1, maximum: 500, default: 500 }
        offset: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        distinct: { type: boolean, default: false }
    DailySearchRequest:
      type: object
      properties:
        date: { type: string, nullable: true }
        category: { type: string, nullable: true }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
        offset: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        withContent: { type: boolean, default: false }
    HotSearchResponse:
      type: object
      properties:
        requestId: { type: string }
        data:
          type: object
          properties:
            query: { type: object }
            summary: { $ref: '#/components/schemas/Summary' }
            items:
              type: array
              items: { $ref: '#/components/schemas/HotItem' }
    HotItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, nullable: true }
        source: { type: string, nullable: true }
        platformId: { type: string, nullable: true }
        channelId: { type: string, nullable: true }
        category: { type: string, nullable: true }
        rootCategory: { type: string, nullable: true }
        rank: { type: integer, nullable: true }
        hotScore: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        observedAt: { type: string, nullable: true }
    ProcurementSearchResponse:
      type: object
      properties:
        requestId: { type: string }
        data:
          type: object
          properties:
            query: { type: object }
            summary: { $ref: '#/components/schemas/Summary' }
            sourceStatuses:
              type: array
              items: { $ref: '#/components/schemas/SourceStatus' }
            items:
              type: array
              items: { $ref: '#/components/schemas/ProcurementItem' }
    ProcurementItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, nullable: true }
        source: { type: string, nullable: true }
        sourceCode: { type: string, nullable: true }
        sourceGroup: { type: string, nullable: true }
        recordFamily: { type: string, nullable: true }
        originalType: { type: string, nullable: true }
        region: { type: string, nullable: true }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        projectNumber: { type: string, nullable: true }
        purchaser: { type: string, nullable: true }
        agency: { type: string, nullable: true }
        amount: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        deadlineAt: { type: string, nullable: true }
        observedAt: { type: string, nullable: true }
        sourceAttributes: { type: object }
    SourceStatus:
      type: object
      properties:
        sourceCode: { type: string, nullable: true }
        collectionStatus: { type: string, nullable: true }
        dataScope: { type: string, nullable: true }
        latestPublicationDate: { type: string, nullable: true }
        dataCount: { type: integer }
        dataUpdateTime: { type: string, nullable: true }
        lastCollectionTime: { type: string, nullable: true }
    CandySearchResponse:
      type: object
      properties:
        requestId: { type: string }
        data:
          type: object
          properties:
            query: { type: object }
            summary: { $ref: '#/components/schemas/Summary' }
            items:
              type: array
              items: { $ref: '#/components/schemas/CandyItem' }
    CandyItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        category: { type: string, nullable: true }
        rootCategory: { type: string }
        hotScore: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
    DailySearchResponse:
      type: object
      properties:
        requestId: { type: string }
        data:
          type: object
          properties:
            query: { type: object }
            summary: { $ref: '#/components/schemas/Summary' }
            items:
              type: array
              items: { $ref: '#/components/schemas/DailyItem' }
    DailyItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string, nullable: true }
        category: { type: string, nullable: true }
        categoryName: { type: string, nullable: true }
        reportDate: { type: string, nullable: true }
        coverImageUrl: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        aiPlatforms: { type: string, nullable: true }
        aiModels: { type: string, nullable: true }
        aiFroms: { type: string, nullable: true }
        totalTokens: { type: integer }
        hotCount: { type: integer }
        generatedAt: { type: string, nullable: true }
        readMinutes: { type: integer }
        contentMarkdown: { type: string, nullable: true }
    Summary:
      type: object
      properties:
        total: { type: integer }
        returned: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
        duplicatesRemoved: { type: integer }
    ErrorResponse:
      type: object
      properties:
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
